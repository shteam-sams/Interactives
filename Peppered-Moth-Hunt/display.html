<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peppered Moth Hunt · Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<link rel="stylesheet" href="moth.css">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="moth-common.js"></script>
<style>
.codechip{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.12em;background:var(--ink);color:var(--bg);padding:4px 14px;border-radius:8px}
.netdot{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.netdot i{width:9px;height:9px;border-radius:50%;background:var(--robin);display:inline-block}
.netdot.ok i{background:var(--moss)}
.joinbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.joinbox .qr{background:#fff;padding:10px;border-radius:8px;line-height:0}
.joinbox .qr img,.joinbox .qr svg{width:180px;height:180px;image-rendering:pixelated}
.joinbox .url{font-size:clamp(16px,2vw,22px);font-weight:700;word-break:break-all}
.joinbox .code{font-family:var(--display);font-weight:800;font-size:clamp(40px,5vw,76px);letter-spacing:.1em;line-height:1;overflow-wrap:anywhere}
.joinbox.compact{grid-template-columns:auto minmax(0,1fr);padding:14px}
.joinbox.compact .qr img,.joinbox.compact .qr svg{width:110px;height:110px}
.joinbox.compact .code{font-size:48px}
.roster{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.roster li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;display:flex;gap:8px;align-items:center}
.roster li.off{opacity:.5}
.roster li.yes{border-color:var(--moss)}
.roster li .tick{color:var(--moss)}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
.huntboard{display:grid;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.huntboard .bar{height:22px}
.huntstats{display:flex;gap:36px;flex-wrap:wrap}
.dim{position:relative;border-radius:var(--r);overflow:hidden;line-height:0}
.dim canvas{width:100%;height:auto;filter:saturate(.8) brightness(.8)}
.dim p{position:absolute;inset:auto 0 0 0;padding:16px 20px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-family:var(--display);font-size:24px;font-weight:800;line-height:1.2}
/* ceremony */
#stage{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at 50% 30%,#2a3326,#0c0f0b 75%);color:#eef1e8;display:grid;place-items:center;overflow-y:auto;padding:24px 16px}
#stage .inner{width:min(1100px,100%);display:grid;gap:18px;justify-items:center;text-align:center;position:relative;z-index:2}
#stage .place{font-family:var(--display);font-weight:800;font-size:clamp(22px,3vw,34px);color:#e0b44a;letter-spacing:.02em}
#stage canvas.crop{width:min(900px,100%);height:auto;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);image-rendering:pixelated}
#stage .who{font-size:clamp(16px,2vw,22px);color:#c9cfc1}
#stage h2{color:#fff;font-size:clamp(28px,4.5vw,52px)}
#stage .btn{background:#262c23;color:#eef1e8;border-color:#4a5445}
#stage .btn.primary{background:#e0b44a;border-color:#e0b44a;color:#1b1a14}
.lb{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px 18px;width:100%;text-align:left}
.lb .r{display:grid;grid-template-columns:40px 96px minmax(0,1fr) auto;gap:12px;align-items:center;background:#1a1f18;border:1px solid #2f372c;border-radius:8px;padding:6px 10px;animation:fadein .5s ease both}
.lb .r b{font-family:var(--display);font-size:20px;color:#e0b44a}
.lb .r canvas{width:96px;height:60px;border-radius:5px;image-rendering:pixelated}
.lb .r .nm{min-width:0}
.lb .r .nm div{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .r .nm span{font-size:13px;color:#9ba594}
.lb .r .sv{font-weight:800;color:#8dbd67;font-variant-numeric:tabular-nums}
.podium{display:grid;gap:14px;align-items:end;width:100%}
.podium .p{display:grid;gap:6px;justify-items:center}
.podium canvas{width:100%;height:auto;border-radius:8px;image-rendering:pixelated}
.podium .step{width:100%;background:#262c23;border-radius:8px 8px 0 0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:32px;color:#e0b44a}
@media (max-width:860px){.split,.joinbox{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 34 24" aria-hidden="true"><path d="M17 3 L32 9 L27 15 L19 21 L17 23 L15 21 L7 15 L2 9 Z" fill="currentColor" opacity=".85"/><path d="M17 3 V23" stroke="var(--surface)" stroke-width="1.6"/></svg>Peppered Moth Hunt</div>
  <ol class="track" id="track"><li data-p="lobby">Gather</li><li data-p="place">Hide</li><li data-p="hunt">Hunt</li><li data-p="results">Results</li></ol>
  <span class="codechip" id="codechip"></span>
  <span class="netdot" id="netdot"><i></i><span>Connecting…</span></span>
  <a class="btn small" href="control.html" target="_blank" rel="noopener">Teacher controls ↗</a>
</header>
<main id="app"></main>
<div id="stage" hidden></div>

<script>
"use strict";
/* ============ host state ============ */
const SAVE_KEY = "pmoth:game:v1", STATUS_KEY = "pmoth:status";
let JOIN_URL = CONFIG.joinUrl || new URL("join.html", location.href.split(/[?#]/)[0]).href;
/* Make sure the student link really reaches join.html. If the display was opened from a different
   (e.g. extra nested) folder, try the likely alternatives and use the first one that exists. */
async function verifyJoinUrl() {
  if (CONFIG.joinUrl || !/^https?:/.test(location.protocol)) return;
  const here = new URL(".", location.href.split(/[?#]/)[0]);
  const segs = here.pathname.split("/").filter(Boolean), cands = [];
  for (let i = 1; i < segs.length; i++) if (segs[i] === segs[i - 1]) cands.push("/" + segs.slice(0, i).concat(segs.slice(i + 1)).join("/") + "/");
  cands.unshift(here.pathname);
  for (let n = segs.length - 1; n >= 0; n--) cands.push("/" + segs.slice(0, n).join("/") + (n ? "/" : ""));
  for (const dir of [...new Set(cands)]) {
    const url = new URL(dir + "join.html", location.origin).href;
    try { const r = await fetch(url, { method: "HEAD", cache: "no-store" }); if (r.ok) { if (url !== JOIN_URL) { JOIN_URL = url; screen = ""; renderScreen(); postStatus(); } return; } } catch (e) { }
  }
}
const JOIN_EXTRA = CONFIG.peerParam ? "&peer=" + encodeURIComponent(CONFIG.peerParam) : "";
const PHASES = ["lobby", "place", "hunt", "results"];
function freshGame() { return { code: newCode(), round: newId(), phase: "lobby", seed: Math.floor(Math.random() * 1e6) + 1, photo: null, photoV: 0, mothsV: 1, threshold: .5, players: {}, bots: {}, hunters: [], results: null, resultsV: 0 }; }
let G = (() => { try { const g = JSON.parse(lsGet(SAVE_KEY)); return g && g.code && g.players ? g : null; } catch (e) { return null; } })() || freshGame();
let scene = null, sceneKey = "";
const conns = new Map();               // cid -> DataConnection
let peer = null, peerState = "connecting", peerTries = 0;
const bc = "BroadcastChannel" in window ? new BroadcastChannel(CONFIG.channel) : null;

/* ============ derived data ============ */
function allMoths() {
  const out = [];
  for (const p of Object.values(G.players)) if (p.moth) out.push({ id: p.cid, owner: p.cid, x: p.moth.x, y: p.moth.y, cells: p.moth.cells, name: p.moth.name, maker: p.name, bot: false });
  for (const b of Object.values(G.bots)) out.push({ id: b.id, owner: b.id, x: b.x, y: b.y, cells: b.cells, name: b.name, maker: "Practice moth", bot: true });
  return out;
}
function stats() {
  const ms = allMoths(), M = ms.length, ids = new Set(ms.map(m => m.id)), hunters = new Map(), times = new Map();
  for (const cid of G.hunters) {
    const p = G.players[cid]; if (!p) continue; const set = new Set();
    for (const f of p.found) if (ids.has(f.m) && f.m !== cid) { set.add(f.m); const t = times.get(f.m); if (!t || f.t < t) times.set(f.m, f.t); }
    hunters.set(cid, set);
  }
  let pool = 0, total = 0;
  for (const [cid, set] of hunters) { pool += M - (G.players[cid] && G.players[cid].moth ? 1 : 0); total += set.size; }
  const need = Math.max(1, Math.ceil(pool * G.threshold));
  return { ms, M, hunters, times, pool, total, need, over: pool > 0 && total >= need };
}

/* ============ persistence, status, broadcast ============ */
let saveT = 0, sendT = 0, lastSend = 0;
function changed(opts = {}) {
  clearTimeout(saveT); saveT = setTimeout(save, 400);
  postStatus();
  const now = Date.now();
  if (now - lastSend > 250) broadcast(); else { clearTimeout(sendT); sendT = setTimeout(broadcast, 250); }
  if (!opts.noRender) renderScreen();
}
function save() { if (!lsSet(SAVE_KEY, JSON.stringify(G))) lsSet(SAVE_KEY, JSON.stringify({ ...G, photo: null, photoV: 0 })); }
function postStatus() {
  const st = stats();
  const s = {
    type: "status", code: G.code, joinUrl: JOIN_URL, phase: G.phase, round: G.round, threshold: G.threshold, seed: G.seed, hasPhoto: !!G.photo, peer: peerState,
    players: Object.values(G.players).map(p => ({ cid: p.cid, name: p.name, online: conns.has(p.cid), hidden: !!p.moth, mothName: p.moth ? p.moth.name : "", found: (st.hunters.get(p.cid) || new Set()).size })),
    bots: Object.keys(G.bots).length, moths: st.M, totals: { total: st.total, need: st.need, pool: st.pool, hunters: st.hunters.size }, ceremony: cer.step, at: Date.now()
  };
  lsSet(STATUS_KEY, JSON.stringify(s)); bc && bc.postMessage(s);
}
function send(c, msg) { try { if (c.open) c.send(msg); } catch (e) { } }
function broadcast() {
  lastSend = Date.now(); const st = stats();
  for (const [cid, c] of conns) sendState(cid, c, st);
}
function sendState(cid, c, st = stats()) {
  const p = G.players[cid]; if (!p) return;
  if (G.photo && c._photoV !== G.photoV) { send(c, { t: "photo", v: G.photoV, data: G.photo }); c._photoV = G.photoV; }
  if ((G.phase === "hunt" || G.phase === "results") && c._mothsV !== G.mothsV + "|" + G.round) {
    send(c, { t: "moths", list: st.ms.map(m => ({ id: m.id, x: m.x, y: m.y, cells: m.cells, name: m.name })) }); c._mothsV = G.mothsV + "|" + G.round;
  }
  if (G.phase === "results" && G.results && c._resV !== G.resultsV + "|" + G.round) { send(c, { t: "results", rows: G.results }); c._resV = G.resultsV + "|" + G.round; }
  const s = {
    t: "state", code: G.code, round: G.round, phase: G.phase, seed: G.seed, photoV: G.photo ? G.photoV : 0, threshold: G.threshold,
    you: { name: p.name, moth: p.moth, found: p.found.map(f => f.m), misses: p.misses },
    counts: { players: Object.keys(G.players).length, hidden: st.M }, totals: { total: st.total, need: st.need, pool: st.pool, over: st.over }
  };
  if (G.phase === "place") s.taken = st.ms.filter(m => m.id !== cid).map(m => [m.x, m.y]);
  send(c, s);
}

/* ============ PeerJS host ============ */
function setNet(state, text) { peerState = state; const n = $("#netdot"); n.className = "netdot" + (state === "online" ? " ok" : ""); n.lastElementChild.textContent = text; postStatus(); }
function startPeer() {
  if (peer) { try { peer.destroy(); } catch (e) { } }
  conns.clear(); setNet("connecting", "Connecting…");
  peer = new Peer(CONFIG.peerPrefix + G.code, CONFIG.peerServer || undefined);
  const myPeer = peer;
  peer.on("open", () => { peerTries = 0; setNet("online", "Room open"); });
  peer.on("connection", c => setupConn(c));
  peer.on("disconnected", () => { if (myPeer !== peer) return; setNet("connecting", "Reconnecting…"); setTimeout(() => { if (myPeer === peer && !peer.destroyed) peer.reconnect(); }, 2000); });
  peer.on("error", e => {
    if (myPeer !== peer) return;
    if (e.type === "unavailable-id") {
      if (++peerTries <= 8) { setNet("connecting", "Reopening room…"); setTimeout(startPeer, 3000); }
      else setNet("error", "This code is open in another window. Close it, or start a new game from Teacher controls.");
    } else if (e.type === "peer-unavailable") { /* a student left; ignore */ }
    else { setNet("error", "Connection problem. Retrying…"); setTimeout(() => { if (myPeer === peer) startPeer(); }, 4000); }
  });
}
function setupConn(c) {
  c.on("data", d => { try { onMsg(c, d); } catch (e) { console.error(e); } });
  const gone = () => { if (c._cid && conns.get(c._cid) === c) { conns.delete(c._cid); changed(); } };
  c.on("close", gone); c.on("error", gone);
}
function onMsg(c, d) {
  if (!d || typeof d !== "object") return;
  if (d.t === "hello") {
    const cid = String(d.cid || "").slice(0, 40), name = cleanName(d.name);
    if (!/^[a-z0-9]{6,40}$/i.test(cid) || !name) return;
    const old = conns.get(cid); if (old && old !== c) { try { old.close(); } catch (e) { } }
    c._cid = cid; conns.set(cid, c);
    const p = G.players[cid] || (G.players[cid] = { cid, name, moth: null, found: [], misses: 0 });
    p.name = name;
    if (G.phase === "hunt" && !G.hunters.includes(cid)) G.hunters.push(cid);
    changed(); sendState(cid, c); return;
  }
  const cid = c._cid, p = cid && G.players[cid]; if (!p) return;
  if (d.t === "moth") {
    if (G.phase !== "place") return send(c, { t: "err", msg: "Hiding time is over." });
    const x = Math.round(+d.x), y = Math.round(+d.y);
    if (!(x >= 20 && x <= W - 20 && y >= 14 && y <= H - 14) || !validCells(d.cells)) return send(c, { t: "err", msg: "That moth couldn't be saved. Try again." });
    if (allMoths().some(m => m.id !== cid && Math.hypot(m.x - x, m.y - y) < 38)) return send(c, { t: "err", code: "taken", msg: "Someone just hid a moth right there. Pick a nearby spot." });
    p.moth = { x, y, cells: d.cells.toLowerCase(), name: cleanName(d.name, 24) || "Unnamed moth" }; G.mothsV++;
    send(c, { t: "ok", what: "moth" }); changed(); return;
  }
  if (d.t === "find") {
    if (G.phase !== "hunt") return; const st = stats(); if (st.over) return;
    const m = st.ms.find(x => x.id === d.m); if (!m || m.id === cid || p.found.some(f => f.m === m.id)) return;
    if (!G.hunters.includes(cid)) G.hunters.push(cid);
    p.found.push({ m: m.id, t: Date.now() });
    if (stats().over) setPhase("results"); else changed();
    return;
  }
  if (d.t === "miss") { p.misses = (p.misses | 0) + 1; changed({ noRender: true }); }
}

/* ============ teacher commands ============ */
function setPhase(ph) {
  if (!PHASES.includes(ph)) return;
  if (ph === "hunt") {
    if (!allMoths().length) { toast("Hide at least one moth first, or add practice moths."); return; }
    const set = new Set(G.hunters); for (const p of Object.values(G.players)) if (p.moth || conns.has(p.cid)) set.add(p.cid); G.hunters = [...set];
  }
  if (ph === "results") { const st = stats(); G.results = rankMoths(scene, st.ms, st.hunters, st.times); G.resultsV++; }
  G.phase = ph; if (ph !== "results") stopCeremony();
  changed();
  if (ph === "results") startCeremony();
}
function newRound() {
  G.round = newId(); G.phase = "lobby"; G.bots = {}; G.hunters = []; G.results = null; G.mothsV++;
  for (const p of Object.values(G.players)) { p.moth = null; p.found = []; p.misses = 0; }
  stopCeremony(); changed();
}
async function onCmd(d) {
  const sceneLocked = !(G.phase === "lobby" || (G.phase === "place" && !allMoths().length));
  switch (d.cmd) {
    case "ping": postStatus(); break;
    case "phase": setPhase(d.phase); break;
    case "threshold": { const v = +d.value; if (v >= .1 && v <= .9) { G.threshold = v; changed(); } break; }
    case "newScene": if (sceneLocked) return toast("The scene is locked once moths are hidden."); G.seed = Math.floor(Math.random() * 1e6) + 1; G.photo = null; await refreshScene(); changed(); break;
    case "photo": if (sceneLocked || typeof d.data !== "string" || !d.data.startsWith("data:image/")) return; G.photo = d.data; G.photoV++; await refreshScene(); changed(); break;
    case "clearPhoto": if (sceneLocked) return; G.photo = null; await refreshScene(); changed(); break;
    case "addBots": { if (G.phase === "results" || !scene) return; const made = makeBots(scene, Math.min(10, d.n | 0 || 5), allMoths()); const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ"; let k = Object.keys(G.bots).length;
      for (const b of made) G.bots[b.id] = { ...b, name: "Practice moth " + letters[k++ % letters.length] }; G.mothsV++; changed(); break; }
    case "removeBots": G.bots = {}; G.mothsV++; changed(); break;
    case "remove": { const c = conns.get(d.cid); if (c) { send(c, { t: "kicked" }); setTimeout(() => { try { c.close(); } catch (e) { } }, 300); conns.delete(d.cid); }
      delete G.players[d.cid]; G.hunters = G.hunters.filter(x => x !== d.cid); G.mothsV++; changed(); break; }
    case "newRound": newRound(); break;
    case "newGame": stopCeremony(); G = freshGame(); scene = null; sceneKey = ""; await refreshScene(); startPeer(); changed(); break;
    case "ceremony": if (G.phase !== "results") return; if (d.action === "replay") startCeremony(); else if (d.action === "next") cerNext(); else if (d.action === "showcase") stopCeremony(true); postStatus(); break;
  }
}
if (bc) bc.onmessage = e => { const d = e.data; if (d && d.type === "cmd") onCmd(d); };

/* ============ scene ============ */
async function refreshScene() {
  const key = G.photo ? "p" + G.photoV : "s" + G.seed; if (key === sceneKey && scene) return;
  sceneKey = key; const s = await makeScene(G.seed, G.photo); if (sceneKey === key) { scene = s; renderScreen(true); }
}

/* ============ screens ============ */
let screen = "", refreshFn = null;
function renderScreen(force) {
  document.querySelectorAll("#track li").forEach(li => { const i = PHASES.indexOf(li.dataset.p), cur = PHASES.indexOf(G.phase); li.className = i === cur ? "on" : i < cur ? "past" : ""; });
  $("#codechip").textContent = G.code;
  const key = (scene ? G.phase : "loading") + "|" + G.round + "|" + sceneKey;
  if (key === screen && !force) { refreshFn && refreshFn(); return; }
  screen = key; refreshFn = null; const app = $("#app"); app.replaceChildren();
  if (!scene) { app.append(h("p", { class: "notice", text: "Growing the forest…" })); return; }
  ({ lobby: scrLobby, place: scrPlace, hunt: scrHunt, results: scrResults })[G.phase](app);
  refreshFn && refreshFn();
}
function sceneCanvas() { const c = document.createElement("canvas"); c.width = W; c.height = H; c.getContext("2d").drawImage(scene.canvas, 0, 0); return c; }
function joinBox(compact) {
  const qr = h("div", { class: "qr" });
  try { const q = qrcode(0, "M"); q.addData(JOIN_URL + "?code=" + G.code + JOIN_EXTRA); q.make(); qr.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch (e) { qr.hidden = true; }
  return h("div", { class: "joinbox" + (compact ? " compact" : "") }, qr, h("div", { style: "display:grid;gap:8px;min-width:0" },
    h("p", { class: "eyebrow", text: "Join on your device" }), h("p", { class: "url", text: JOIN_URL.replace(/^https?:\/\//, "") }),
    h("p", { class: "eyebrow", text: "Room code" }), h("p", { class: "code", text: G.code })));
}
function rosterEl(markHidden) {
  const ul = h("ul", { class: "roster" });
  const ps = Object.values(G.players).sort((a, b) => a.name.localeCompare(b.name));
  if (!ps.length) ul.append(h("li", { class: "off", text: "No one yet" }));
  for (const p of ps) ul.append(h("li", { class: (conns.has(p.cid) ? "" : "off") + (markHidden && p.moth ? " yes" : "") }, markHidden && p.moth ? h("span", { class: "tick", text: "✓" }) : null, p.name));
  return ul;
}
function scrLobby(app) {
  const roster = h("div");
  app.append(h("section", { class: "split" },
    h("div", { style: "display:grid;gap:16px" }, h("p", { class: "eyebrow", text: "Natural selection · Industrial England, 1850–1950" }), h("h1", { text: "Hide a moth. Then hunt like a bird." }),
      h("p", { class: "lede", text: "When factory soot darkened the trees and killed pale lichens, birds spotted light peppered moths more easily, and dark moths became common. Today you'll test that idea yourself." }),
      h("figure", { class: "scene-thumb" }, sceneCanvas())),
    h("div", { style: "display:grid;gap:16px" }, joinBox(false), h("h3", { id: "rc" }), roster)));
  refreshFn = () => { $("#rc").textContent = `In the forest: ${Object.keys(G.players).length}`; roster.replaceChildren(rosterEl(false)); };
}
function scrPlace(app) {
  const roster = h("div"), count = h("p", { class: "big" });
  app.append(h("div", { class: "stephead" }, h("div", { class: "text" }, h("p", { class: "eyebrow", text: "Hide" }), h("h1", { text: "Find a spot. Color your moth to vanish." }))),
    h("section", { class: "split" }, h("figure", { class: "scene-thumb" }, sceneCanvas()),
      h("div", { style: "display:grid;gap:16px" }, h("div", {}, count, h("p", { class: "small", text: "moths hidden" })), roster, joinBox(true))));
  refreshFn = () => { const n = Object.values(G.players).filter(p => p.moth).length; count.textContent = `${n} of ${Object.keys(G.players).length}`; roster.replaceChildren(rosterEl(true)); };
}
function scrHunt(app) {
  const eaten = h("span", { class: "big" }), need = h("span", { class: "small" }), bar = h("i"), birds = h("b"), unseen = h("b"), hiding = h("p");
  app.append(h("div", { class: "stephead" }, h("div", { class: "text" }, h("p", { class: "eyebrow", text: "Hunt" }), h("h1", { text: "The birds are hungry." }))),
    h("section", { class: "huntboard" }, h("div", { class: "row", style: "justify-content:space-between;align-items:baseline" }, h("div", {}, eaten, " ", h("span", { class: "small", text: "moths eaten" })), need),
      h("div", { class: "bar" }, bar), h("div", { class: "huntstats" }, h("div", { class: "stat" }, birds, h("span", { text: "birds hunting" })), h("div", { class: "stat" }, unseen, h("span", { text: "moths no bird has found yet" })))),
    h("div", { class: "dim" }, sceneCanvas(), hiding));
  refreshFn = () => { const st = stats(); eaten.textContent = st.total; need.textContent = `The hunt ends at ${st.need} of ${st.pool} possible finds (${Math.round(G.threshold * 100)}%)`; bar.style.width = Math.min(100, st.total / st.need * 100) + "%";
    birds.textContent = st.hunters.size; const seen = new Set(); for (const s of st.hunters.values()) s.forEach(x => seen.add(x)); unseen.textContent = st.M - seen.size; hiding.textContent = `${st.M} moths are hiding somewhere in here.`; };

function scrResults(app) {
  const rows = G.results || [], st = stats(), tbody = h("tbody"), grid = h("div", { class: "grid" }), chart = h("div", { class: "chartbox" });
  const never = rows.filter(r => r.found === 0).length;

    h("div", { class: "tablewrap" }, h("table", { class: "board" }, h("thead", {}, h("tr", {}, ...["#", "Spot", "Moth", "Made by", "Spotted by", "Survival"].map(t => h("th", { text: t })))), tbody)),

    tbody.append(h("tr", {}, h("td", { class: "rank", text: String(r.rank) }), h("td", {}, c), h("td", { text: r.name }), h("td", { text: r.maker }), h("td", { text: `${r.found} of ${r.elig}` }), h("td", {}, h("span", { class: "pill " + (r.pct < .5 ? "safe" : "eaten"), text: Math.round((1 - r.pct) * 100) + "% survived" })))); }

const rowsAsMoths = rows => rows.map(r => ({ id: r.id, x: r.x, y: r.y, cells: r.cells }));

  return h("article", { class: "card" }, c, h("div", { class: "body" }, h("div", { class: "top2" }, h("h3", { text: r.name }), h("span", { class: "pct", text: Math.round(r.pct * 100) + "% found" })),
    h("div", { class: "bar" }, h("i", { style: `width:${r.pct * 100}%` })), h("p", { class: "sub", text: `#${r.rank} · ${r.maker} · found by ${r.found} of ${r.elig} birds · color match ${r.match}%` })));
}

/* ============ ceremony: leaderboard → 3rd → 2nd → 1st → podium → showcase ============ */
const cer = { step: null, steps: [], i: 0, timer: 0, raf: 0, stopped: true };
const LABEL = ["1st place survivor", "2nd place survivor", "3rd place survivor"];
function startCeremony() {
  stopCeremony(); const rows = G.results || []; if (!rows.length || !scene) return;
  cer.steps = ["board", ...[2, 1, 0].filter(i => rows[i]).map(i => "v" + i), "podium"]; cer.i = 0; cer.stopped = false;
  $("#stage").hidden = false; document.body.style.overflow = "hidden"; showStep();
}
function stopCeremony(scroll) {
  cer.stopped = true; clearTimeout(cer.timer); cancelAnimationFrame(cer.raf); cer.step = null;
  const st = $("#stage"); if (st) { st.hidden = true; st.replaceChildren(); } document.body.style.overflow = "";

    const lb = h("div", { class: "lb" });

      lb.append(h("div", { class: "r", style: `animation-delay:${(rows.length > 16 ? 16 : rows.length) * 0.12 - i * 0.12}s` }, h("b", { text: "#" + r.rank }), c, h("div", { class: "nm" }, h("div", { text: r.name }), h("span", { text: r.maker })), h("span", { class: "sv", text: Math.round((1 - r.pct) * 100) + "%" }))); });
    stage.replaceChildren(h("div", { class: "inner fadein" }, h("div", { class: "place", text: "The leaderboard" }), h("h2", { text: "Which moths fooled the birds?" }),
      h("p", { class: "who", text: "Survival = share of birds that never found the moth." }), lb, acts("Reveal the survivors")));
    cer.timer = setTimeout(cerNext, 9000 + rows.length * 120); return;
  }

    stage.replaceChildren(h("div", { class: "inner fadein" }, h("div", { class: "place", text: LABEL[k] }), h("p", { class: "who", text: "Can you spot it?" }), cv, h("h2", { text: r.name }),
      h("p", { class: "who", text: `Made by ${r.maker} · spotted by ${r.found} of ${r.elig} birds (${Math.round(r.pct * 100)}%)` }), acts(k === 0 ? "Show the podium" : "Next survivor")));
    const t0 = performance.now();
    const anim = () => { if (cer.stopped) return; const t = (performance.now() - t0) / 1000; if (t > 3) { const a = clamp((t - 3) / .6, 0, 1); drawCrop(cv, scene, r, 5, { moths: all, ring: true, ringAlpha: a }); if (a < 1) cer.raf = requestAnimationFrame(anim); } else cer.raf = requestAnimationFrame(anim); };
    cer.raf = requestAnimationFrame(anim); cer.timer = setTimeout(cerNext, 9000); return;
  }
  // podium
  const slots = [1, 0, 2].filter(i => rows[i]), heights = { 0: 140, 1: 96, 2: 66 };
  stage.replaceChildren(h("div", { class: "inner fadein" }, h("div", { class: "place", text: "The survivors" }), h("h2", { text: "Best-hidden moths of the round" }),
    h("div", { class: "podium", style: `grid-template-columns:repeat(${slots.length},minmax(0,1fr))` }, ...slots.map(i => { const r = rows[i], c = h("canvas"); drawCrop(c, scene, r, 2, { moths: all, ring: true });
      return h("div", { class: "p" }, c, h("strong", { text: r.name }), h("span", { class: "who", style: "font-size:15px", text: r.maker }), h("div", { class: "step", style: `height:${heights[i]}px`, text: String(i + 1) })); })),
    h("div", { class: "acts" }, h("button", { class: "btn primary", text: "See every moth", onclick: () => stopCeremony(true) }))));
