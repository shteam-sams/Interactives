<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peppered Moth Hunt · Teacher Controls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<link rel="stylesheet" href="moth.css">
<script src="moth-common.js"></script>
<style>
main{max-width:720px;gap:14px}
section.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.code{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:.14em;line-height:1}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps button{padding:10px 6px}
.steps button.on{background:var(--moss);border-color:var(--moss);color:var(--moss-ink)}
.roster{list-style:none;margin:0;padding:0;display:grid}
.roster li{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.roster .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.roster .dot.on{background:var(--moss)}
.roster .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:flex;gap:24px;flex-wrap:wrap}
.confirmbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 34 24" aria-hidden="true"><path d="M17 3 L32 9 L27 15 L19 21 L17 23 L15 21 L7 15 L2 9 Z" fill="currentColor" opacity=".85"/><path d="M17 3 V23" stroke="var(--surface)" stroke-width="1.6"/></svg>Teacher Controls</div>
  <a class="btn small" href="display.html" target="_blank" rel="noopener">Open display ↗</a>
</header>
<main id="app"><p class="notice">Looking for the display…</p></main>
<script>
"use strict";
const bc = "BroadcastChannel" in window ? new BroadcastChannel(CONFIG.channel) : null;
let st = null, lastAt = 0, pendingConfirm = null;
function cmd(o) { if (!bc) { toast("This browser can't talk to the display."); return; } bc.postMessage({ type: "cmd", ...o }); }
if (bc) bc.onmessage = e => { const d = e.data; if (d && d.type === "status") { st = d; lastAt = Date.now(); render(); } };
try { const s = JSON.parse(lsGet("pmoth:status")); if (s) st = s; } catch (e) { }
cmd({ cmd: "ping" });
setInterval(() => { cmd({ cmd: "ping" }); if (Date.now() - lastAt > 6000) render(); }, 3000);

const NEXT = {
  lobby: ["Open hiding", "place", "Students pick a spot and color their moth."],
  place: ["Start the hunt", "hunt", "Students who haven't released a moth can still hunt."],
  hunt: ["End the hunt now", "results", "The hunt also ends on its own at the threshold."],
  results: null
};
function render() {
  const app = $("#app"), alive = Date.now() - lastAt < 6000;
  const keep = document.activeElement && document.activeElement.id;
  app.replaceChildren();
  if (!st || !alive) {
    app.append(h("div", { class: "notice warn" }, h("h3", { text: "The display isn't open" }),
      h("p", { class: "small", text: "Open display.html in this same browser (another tab, a projector window, or an OBS dock). These controls talk to it directly." }),
      h("div", {}, h("a", { class: "btn primary", href: "display.html", target: "_blank", rel: "noopener", text: "Open the display" }))));
    if (!st) return;
  }
  const t = st.totals, players = st.players.slice().sort((a, b) => a.name.localeCompare(b.name));
  // room
  app.append(h("section", { class: "box" }, h("div", { class: "row", style: "justify-content:space-between" }, h("div", {}, h("p", { class: "eyebrow", text: "Room code" }), h("p", { class: "code", text: st.code })),
    h("div", { style: "text-align:right" }, h("p", { class: "small", text: st.peer === "online" ? "Room open" : st.peer === "error" ? "Connection problem" : "Connecting…" }), h("p", { class: "small", text: `${players.filter(p => p.online).length} online · ${players.length} joined` }))),
    h("div", { class: "row" }, h("input", { type: "text", readonly: true, value: st.joinUrl + "?code=" + st.code, id: "joinurl", style: "flex:1" }),
      h("button", { class: "btn small", text: "Copy link", onclick: () => { const i = $("#joinurl"); navigator.clipboard ? navigator.clipboard.writeText(i.value).then(() => toast("Link copied."), () => { i.select(); }) : i.select(); } }))));
  // phase
  const nx = NEXT[st.phase];
  const steps = h("div", { class: "steps" }, ...[["lobby", "Gather"], ["place", "Hide"], ["hunt", "Hunt"], ["results", "Results"]].map(([p, l]) => h("button", { class: "btn" + (st.phase === p ? " on" : ""), text: l, onclick: () => { if (p !== st.phase) confirmThen(`Jump to ${l}?`, () => cmd({ cmd: "phase", phase: p })); } })));
  const phaseBox = h("section", { class: "box" }, h("h3", { text: "Phase" }), steps);
  if (nx) phaseBox.append(h("p", { class: "small", text: nx[2] }), h("button", { class: "btn primary", text: nx[0], onclick: () => cmd({ cmd: "phase", phase: nx[1] }) }));
  if (st.phase === "place") phaseBox.append(h("p", { text: `${st.moths} moth${st.moths === 1 ? "" : "s"} hidden (${st.bots} practice).` }));
  if (st.phase === "hunt") phaseBox.append(h("div", { class: "kv" }, h("div", { class: "stat" }, h("b", { text: `${t.total} / ${t.need}` }), h("span", { text: "moths eaten / needed to end" })), h("div", { class: "stat" }, h("b", { text: String(t.hunters) }), h("span", { text: "birds hunting" }))),
    h("div", { class: "bar" }, h("i", { style: `width:${Math.min(100, t.total / t.need * 100)}%` })));
  if (st.phase === "results") phaseBox.append(h("p", { class: "small", text: st.ceremony ? "Ceremony playing on the display." : "Showing the leaderboard and showcase." }),
    h("div", { class: "row" }, h("button", { class: "btn primary", text: st.ceremony ? "Next" : "Play the ceremony", onclick: () => cmd({ cmd: "ceremony", action: st.ceremony ? "next" : "replay" }) }),
      st.ceremony ? h("button", { class: "btn", text: "Skip to showcase", onclick: () => cmd({ cmd: "ceremony", action: "showcase" }) }) : null,
      h("button", { class: "btn", text: "Start a new round", onclick: () => cmd({ cmd: "newRound" }) })));
  app.append(phaseBox);
  // threshold
  const sel = h("select", { id: "threshold" }, ...[.25, .4, .5, .6, .75].map(v => h("option", { value: v, selected: Math.abs(st.threshold - v) < .001, text: Math.round(v * 100) + "% of all possible finds" })));
  sel.onchange = () => cmd({ cmd: "threshold", value: +sel.value });
  app.append(h("section", { class: "box" }, h("h3", { text: "When does the hunt end?" }), sel,
    h("p", { class: "small", text: t.pool ? `${t.hunters} birds × the moths they can hunt = ${t.pool} possible finds (no one hunts their own moth). The hunt stops at ${t.need}.` : "Each student hunts every moth except their own. The total updates as moths are hidden." })));
  // scene
  const locked = !(st.phase === "lobby" || (st.phase === "place" && !st.moths));
  const file = h("input", { type: "file", accept: "image/*", id: "photo", hidden: true });
  file.onchange = async () => { const f = file.files[0]; if (!f) return; toast("Preparing photo…"); try { cmd({ cmd: "photo", data: await fileToSceneDataUrl(f) }); toast("Photo sent to the display."); } catch (e) { toast("That file couldn't be read as an image."); } file.value = ""; };
  app.append(h("section", { class: "box" }, h("h3", { text: "Scene" }), h("p", { class: "small", text: st.hasPhoto ? "Using your photo." : "Using a generated forest: clean lichen trees on the left, soot-darkened trees and brick on the right." }),
    h("div", { class: "row" }, h("button", { class: "btn small", disabled: locked, text: "New generated forest", onclick: () => cmd({ cmd: "newScene" }) }),
      h("button", { class: "btn small", disabled: locked, text: "Upload a photo", onclick: () => file.click() }), file,
      st.hasPhoto ? h("button", { class: "btn small", disabled: locked, text: "Back to generated forest", onclick: () => cmd({ cmd: "clearPhoto" }) }) : null),
    locked ? h("p", { class: "small", text: "The scene is locked once moths are hidden. Start a new round to change it." }) : null));
  // practice
  app.append(h("section", { class: "box" }, h("h3", { text: "Practice moths" }), h("p", { class: "small", text: "Computer-made moths, half well hidden and half not. Use them to test alone or to pad a small class." }),
    h("div", { class: "row" }, h("button", { class: "btn small", disabled: st.phase === "results", text: "Add 5 practice moths", onclick: () => cmd({ cmd: "addBots", n: 5 }) }),
      h("button", { class: "btn small", disabled: !st.bots, text: `Remove practice moths${st.bots ? " (" + st.bots + ")" : ""}`, onclick: () => cmd({ cmd: "removeBots" }) }))));
  // roster
  const ul = h("ul", { class: "roster" });
  for (const p of players) ul.append(h("li", {}, h("span", { class: "dot" + (p.online ? " on" : ""), title: p.online ? "Online" : "Offline" }), h("span", { class: "nm", text: p.name + (p.mothName ? " · “" + p.mothName + "”" : "") }),
    h("span", { class: "small", text: st.phase === "hunt" || st.phase === "results" ? `found ${p.found}` : p.hidden ? "hidden ✓" : "" }),
    h("button", { class: "btn small danger", text: "Remove", "aria-label": "Remove " + p.name, onclick: () => confirmThen(`Remove ${p.name}?`, () => cmd({ cmd: "remove", cid: p.cid })) })));
  if (!players.length) ul.append(h("li", {}, h("span"), h("span", { class: "small", text: "Students appear here when they join." })));
  app.append(h("section", { class: "box" }, h("h3", { text: "Class" }), ul));
  // game
  app.append(h("section", { class: "box" }, h("h3", { text: "Game" }),
    h("div", { class: "row" }, h("button", { class: "btn small", text: "New round (same code)", onclick: () => confirmThen("Clear all moths and start a new round?", () => cmd({ cmd: "newRound" })) }),
      h("button", { class: "btn small danger", text: "New game (new code)", onclick: () => confirmThen("Start over with a new room code? Students will need to rejoin.", () => cmd({ cmd: "newGame" })) }))));
  if (pendingConfirm) app.prepend(h("div", { class: "notice warn" }, h("p", { text: pendingConfirm.q }), h("div", { class: "confirmbar" },
    h("button", { class: "btn primary", text: "Yes", onclick: () => { const f = pendingConfirm.f; pendingConfirm = null; f(); render(); } }), h("button", { class: "btn", text: "Cancel", onclick: () => { pendingConfirm = null; render(); } }))));
  if (keep && $("#" + keep)) $("#" + keep).focus();
}
function confirmThen(q, f) { pendingConfirm = { q, f }; render(); scrollTo({ top: 0, behavior: "smooth" }); }
render();
</script>
</body>
</html>
