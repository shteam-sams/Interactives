<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<link rel="stylesheet" href="moth.css">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="moth-common.js"></script>
<style>

.me{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 34 24" aria-hidden="true"><path d="M17 3 L32 9 L27 15 L19 21 L17 23 L15 21 L7 15 L2 9 Z" fill="currentColor" opacity=".85"/><path d="M17 3 V23" stroke="var(--surface)" stroke-width="1.6"/></svg>Peppered Moth Hunt</div>
  <ol class="track" id="track"><li data-p="lobby">Gather</li><li data-p="place">Hide</li><li data-p="hunt">Hunt</li><li data-p="results">Results</li></ol>
  <span class="me" id="me"></span>
</header>
<div class="banner" id="banner" hidden>Reconnecting to the game…</div>
<main id="app"></main>

<script>
"use strict";
const PHASES = ["lobby", "place", "hunt", "results"];
const params = new URLSearchParams(location.search);
let cid = lsGet("pmoth:cid"); if (!cid) { cid = newId() + newId(); lsSet("pmoth:cid", cid); }
const S = {
  code: (params.get("code") || lsGet("pmoth:code") || "").toUpperCase().slice(0, 5), name: lsGet("pmoth:name") || "",

function resetLocal() {

resetLocal();

/* ============ connection ============ */

/* ============ router ============ */

}
function sceneCanvas(src) { const c = document.createElement("canvas"); c.width = W; c.height = H; c.getContext("2d").drawImage(src || S.scene.canvas, 0, 0); return c; }

/* ============ join ============ */

    h("div", {}, h("button", { class: "btn small", text: "Cancel", onclick: () => { try { peer && peer.destroy(); } catch (e) { } peer = null; S.joined = false; S.connected = false; S.everConnected = false; $("#banner").hidden = true; renderScreen(true); } }))));
}
function scrLobby(app) {
  app.append(h("section", { class: "intro" },
    h("div", { class: "text" }, h("p", { class: "eyebrow", text: "Natural selection · Industrial England, 1850–1950" }), h("h1", { text: "Hide a moth. Then hunt like a bird." }),
      h("p", { class: "lede", text: "Peppered moths rest on tree bark by day. When factory soot darkened the trees and killed pale lichens, birds spotted light moths more easily, and dark moths became common. Today you'll test that idea yourself." }),
      h("ol", { class: "how" }, h("li", { text: "Pick a resting spot somewhere in the forest." }), h("li", { text: "Color your moth to blend in with what's around it." }), h("li", { text: "Become a bird: find as many classmates' moths as you can." }), h("li", { text: "The best-hidden moths survive and win." })),
      h("p", { class: "notice", text: `You're in, ${S.name}! Waiting for your teacher to open the forest…` })),
    h("figure", { class: "scene-thumb" }, sceneCanvas())));
}

/* ============ hide: pick a spot ============ */

    h("p", { class: "lede", text: "Pale lichen, sooty bark, brick, stone, leaves: tap the spot where you think you can disappear." })));
  const cv = h("canvas", { class: "view", "aria-label": "The forest. Tap where your moth should rest." }); const wrap = h("div", { class: "viewwrap" }, cv);
  const cropCv = h("canvas"), area = h("div", { class: "playarea" });

  const imm = makeImmersive(area, on => { S.wantImm = on; fsb && fsb._sync(); requestAnimationFrame(() => v.resize()); });
  const confirm = h("div", { class: "confirm", hidden: true }, cropCv, h("div", {}, h("h3", { text: "Rest here?" }),
    h("p", { class: "small no-imm", text: "This is the patch you'll color your moth against. The dashed box shows your moth's size." }),
    h("div", { class: "acts" }, h("button", { class: "btn primary", text: "Zoom in and color it", onclick: () => { if (!p.cells) p.cells = Array(NC).fill(BLANK); p.undo = []; p.step = "color"; renderScreen(); } }),
      h("button", { class: "btn", text: "Pick a different spot", onclick: () => { p.pick = null; confirm.hidden = true; v.draw(); requestAnimationFrame(() => v.resize()); } }))));

    }

  const ctl = viewControls(v, imm); fsb = ctl.querySelector(".fsbtn"); wrap.append(ctl);
  S.cleanup.push(() => { v.destroy(); imm.destroy(); });
  area.append(h("p", { class: "hint only-imm", text: "Tap a resting spot. Pinch or scroll to zoom, drag to look around." }), wrap, confirm);
  app.append(head, h("p", { class: "hint", text: "Scroll or pinch to zoom, drag to look around, or press Full screen for the biggest view." }), area);
  if (p.pick) requestAnimationFrame(() => { drawCrop(cropCv, S.scene, p.pick, 2, { moths: [], ghost: true }); confirm.hidden = false; });

}

/* ============ hide: color ============ */

function scrDone(app) {

  app.append(h("section", { class: "donegrid" }, cv, h("div", { style: "display:grid;gap:12px" }, h("p", { class: "eyebrow", text: "Hidden" }), h("h2", { text: "“" + mm.name + "” is resting" }),

/* ============ hunt ============ */
function composite() {
  if (!S.composite) { const c = sceneCanvas(), g = c.getContext("2d"); for (const m of S.moths) drawCells(g, m, parseCells(m.cells), 0, 0, 1); S.composite = c; }
  return S.composite;
}
function scrHunt(app) {
  S.composite = null;
  const youB = h("b"), missB = h("b"), lbl = h("span"), bar = h("i"), need = h("span");
  const cv = h("canvas", { class: "view", "aria-label": "The forest with every moth hidden in it. Tap a moth to catch it." }), wrap = h("div", { class: "viewwrap" }, cv), ripples = []; let anim = 0, full = null;
  const robin = getComputedStyle(document.body).getPropertyValue("--robin").trim() || "#b9532b";
  const foundSet = () => new Set([...S.state.you.found, ...S.hunt.pending]);
  const area = h("div", { class: "playarea" });
  let v, fsb; const imm = makeImmersive(area, on => { S.wantImm = on; fsb && fsb._sync(); bigFs._sync(); requestAnimationFrame(() => v.resize()); });
  v = makeView(cv, {
    image: composite,
    overlay: (g, v) => {
      const fs = foundSet(), k = v.k();

      const now = performance.now();

        if (r.hit) drawRing(g, x, y, Math.max(12, 24 * k) * (1 + (1 - t) * 1.5), 1 - t * .6, "#ffd75e");
        else { g.strokeStyle = `rgba(255,255,255,${1 - t})`; g.lineWidth = 2; g.beginPath(); g.arc(x, y, 6 + t * 22, 0, 7); g.stroke(); } }
    },
    onClick: (wx, wy, v) => {
      if (S.state.phase !== "hunt" || S.state.totals.over) return;
      const fs = foundSet(), tol = clamp(10 / v.k(), 3, 7);
      const hits = S.moths.filter(m => hitMothNear(m, wx, wy, tol)).sort((a, b) => Math.hypot(a.x - wx, a.y - wy) - Math.hypot(b.x - wx, b.y - wy));
      const hit = hits.find(m => m.id !== cid && !fs.has(m.id)) || hits[0];
      if (hit && hit.id === cid) { toast("That's your own moth. Keep looking!"); return; }
      if (hit && fs.has(hit.id)) { toast("You already found that one."); return; }
      if (hit) { S.hunt.pending.add(hit.id); sendMsg({ t: "find", m: hit.id }); toast("Gotcha! You found “" + hit.name + "”."); ripples.push({ x: hit.x, y: hit.y, t: performance.now(), hit: true }); S.refreshFn(); }
      else { S.hunt.misses++; sendMsg({ t: "miss" }); ripples.push({ x: wx, y: wy, t: performance.now() }); missB.textContent = Math.max(S.hunt.misses, S.state.you.misses || 0); }
      kick();
    }
  });
  function kick() { cancelAnimationFrame(anim); const step = () => { v.draw(); if (ripples.some(r => performance.now() - r.t < 900)) anim = requestAnimationFrame(step); }; step(); }
  const ctl = viewControls(v, imm); fsb = ctl.querySelector(".fsbtn"); wrap.append(ctl);
  const bigFs = fsButton(imm, "Play full screen"); bigFs.classList.add("primary"); bigFs.classList.remove("small");
  S.cleanup.push(() => { cancelAnimationFrame(anim); v.destroy(); imm.destroy(); });
  const mine = myMoth();
  area.append(h("div", { class: "hudbar" }, h("div", { class: "meter" }, h("div", { class: "lbl" }, lbl, need), h("div", { class: "bar" }, bar)),
    h("div", { class: "stat" }, youB, h("span", { text: "you found" })), h("div", { class: "stat" }, missB, h("span", { text: "missed pecks" }))), wrap);
  app.append(h("div", { class: "stephead" }, h("div", { class: "text" }, h("p", { class: "eyebrow", text: "Hunt" }), h("h2", { text: "You're a hungry bird. Find the moths!" }),
    h("p", { class: "lede", text: (mine ? "Your own moth doesn't count. " : "") + "Tap a moth to catch it. The round ends when the birds have eaten enough." })), bigFs),
    h("p", { class: "hint", text: "Scroll or pinch to zoom, drag to search. When zoomed in, tap the little map in the corner to jump around." }), area);
  S.refreshFn = () => {
    const st = S.state, t = st.totals; youB.textContent = foundSet().size; missB.textContent = Math.max(S.hunt.misses, st.you.misses || 0);
    lbl.replaceChildren("Birds have eaten ", h("b", { text: String(t.total) }), " moths"); need.textContent = `round ends at ${t.need}`;
    bar.style.width = Math.min(100, t.total / t.need * 100) + "%"; v.draw();
    if (t.over && !full) { full = h("div", { class: "fullmsg" }, h("div", {}, h("h2", { text: "The birds are full!" }), h("p", { text: "Enough moths have been eaten. Watch the board for the survivors." }), imm.on ? h("button", { class: "btn", text: "Exit full screen", onclick: () => imm.exit() }) : null)); wrap.append(full); }
  };
  if (S.wantImm) imm.enter({ real: false });
}

/* ============ results ============ */
function scrResults(app) {
  S.wantImm = false;
  const rows = S.results, all = rows.map(r => ({ id: r.id, x: r.x, y: r.y, cells: r.cells })), me = rows.find(r => r.id === cid);
  const tbody = h("tbody"), grid = h("div", { class: "grid" }), chart = h("div", { class: "chartbox" });
  let mine;
  if (me) { const c = h("canvas"); drawCrop(c, S.scene, me, 3, { moths: all, ring: true });
    mine = h("section", { class: "mycard" }, c, h("div", { style: "display:grid;gap:10px" }, h("p", { class: "eyebrow", text: "Your moth" }), h("h2", { text: me.name }),
      h("p", { class: "big", text: "#" + me.rank }), h("p", { text: `${me.found} of ${me.elig} birds found it (${Math.round(me.pct * 100)}%). Color match ${me.match}%.` }),
      h("p", { class: "small", text: me.rank <= 3 ? "Top three! Your moth is one of the best hidden." : me.pct < .5 ? "Your moth survived most of the birds." : "Most birds found it. What would help it blend in next time?" }))); }

    h("div", { class: "tablewrap" }, h("table", { class: "board" }, h("thead", {}, h("tr", {}, ...["#", "Spot", "Moth", "Made by", "Spotted by", "Survival"].map(t => h("th", { text: t })))), tbody)),
    h("h3", { text: "Moth showcase" }), grid, chart);

      h("div", { class: "bar" }, h("i", { style: `width:${r.pct * 100}%` })), h("p", { class: "sub", text: `#${r.rank} · ${r.maker} · found by ${r.found} of ${r.elig} birds · color match ${r.match}%` })))); }
